name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm install --no-save @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/vite/node_modules/rollup/package.json').version")
      - run: npm exec vite build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIOM_90F7C }}
          channelId: live
          projectId: aiom-90f7c
